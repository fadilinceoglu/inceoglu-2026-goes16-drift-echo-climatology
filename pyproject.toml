[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "goes16-drift-echo-climatology"
version = "0.1.0"
description = "Calculations for the GOES-16 drift-echo climatology study"
requires-python = ">=3.9"
dependencies = [
    "numpy==1.26.4",
    "netCDF4==1.7.1.post2",
    "cdflib==1.3.3",
    "pandas==2.3.0",
    "scipy==1.13.1",
    "spacepy==0.7.0",
    "matplotlib==3.5.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drift_echo_climatology = ["assets/*.npz", "assets/README.md"]
